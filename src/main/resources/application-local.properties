# -------------------------------------------------------------------
# Local Development Profile (application-local.properties)
# Activated only with --spring.profiles.active=local or SPRING_PROFILES_ACTIVE=local
# -------------------------------------------------------------------

# Fixed local MySQL URL
spring.datasource.url=jdbc:mysql://localhost:3306/lendloop

# Credentials: DB_USERNAME / DB_PASSWORD env vars with fallback to standard local defaults
spring.datasource.username=${DB_USERNAME:lendloop_user}
spring.datasource.password=${DB_PASSWORD:}

# Local development port
server.port=8081

# Show SQL queries during local development
spring.jpa.show-sql=true

